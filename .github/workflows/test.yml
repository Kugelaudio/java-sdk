name: test

# Runs on the public mirror github.com/Kugelaudio/java-sdk, not in the monorepo
# (CONTRIBUTING.md). Same suite as the monorepo's java-sdk check.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
